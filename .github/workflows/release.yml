name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+ # matches v1.0.0-style tags; GitHub filter syntax, not regex

permissions:
  contents: write # creating a Release needs write access; the ci workflow stays read-only

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the release gate can see origin/main

      # Release gate (L-05 p.12): only commits on main history may be published.
      # GITHUB_SHA is the commit the tag points at; being an ancestor of
      # origin/main means it is part of the trunk, not an unmerged branch.
      - name: Release gate (tag must sit on main history)
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release gate passed: $GITHUB_SHA is on main history"
          else
            echo "release gate failed: tag $GITHUB_REF_NAME points at $GITHUB_SHA," \
              "which is not on main history; merge the change first" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      # Same quality gate as ci, run once more right before publishing.
      - name: Check formatting (gofmt)
        run: make fmt-check

      - name: Static analysis (go vet)
        run: make vet

      - name: Run tests
        run: make test

      # The release build reruns on the tagged commit instead of reusing the
      # ci artifact: the version string is baked into the binary at compile
      # time (discussed in LAB1.md question 3).
      - name: Package release artifact
        env:
          VERSION: ${{ github.ref_name }} # tag v1.0.0, leading v stripped below
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package VERSION="${VERSION#v}" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          echo "== binary"
          sha256sum dist/*/enroll-conflict
          echo "== artifact"
          sha256sum dist/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }} # per-run temporary token
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "$TAG" \
            --notes "Built from commit $GITHUB_SHA (run $GITHUB_RUN_ID) on ubuntu-24.04 with go1.26.9."

  image:
    name: Build and push container image
    needs: release
    runs-on: ubuntu-24.04
    # A job-level permissions block replaces the workflow-level one instead of merging,
    # so contents has to be declared again or `gh release download` gets a 403.
    permissions:
      contents: read
      packages: write # pushing container images to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" -p "enroll-conflict_${TAG#v}_linux_amd64.tar.gz" -D dist

      - name: Unpack release artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/pkg
          tar -xzf "dist/enroll-conflict_${TAG#v}_linux_amd64.tar.gz" -C /tmp/pkg

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and push container image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_NAME="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          VERSION="${TAG#v}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT_SHA" \
            --build-arg SOURCE="https://github.com/${REPO}" \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            "/tmp/pkg/enroll-conflict_${VERSION}_linux_amd64"
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"
